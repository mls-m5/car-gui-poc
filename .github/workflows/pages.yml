name: Deploy Emscripten demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and Bullet submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Emscripten application
        run: docker build --file Dockerfile.emscripten --tag car-gui-pages .

      - name: Extract static site
        run: |
          container_id=$(docker create car-gui-pages)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p _site
          docker cp "$container_id:/usr/share/nginx/html/." _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
