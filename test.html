<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elbilsdashboard med Indikatorer</title>
  <style>
    :root {
      --bg-color: #0a0c10;
      --card-bg: rgba(255, 255, 255, 0.03);
      --text-main: #ffffff;
      --text-muted: #6c7a89;
      --speed-color: #00f2fe;
      --range-color: #38ef7d;
      --battery-color: #10b981;
      --track-color: rgba(255, 255, 255, 0.08);

      /* Indikatorfärger */
      --color-turn: #10b981;    /* Grön */
      --color-lowbeam: #10b981; /* Grön */
      --color-highbeam: #3b82f6;/* Blå */
      --color-warning: #ef4444; /* Röd */
      --color-tpms: #f59e0b;    /* Orange/Gul */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Dashboard Container */
    .dashboard {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 30px 30px 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Övre Indikatorrad för symboler */
    .indicators-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .indicator-icon {
      width: 28px;
      height: 28px;
      fill: #2a323d; /* Släckt/Inaktiv färg */
      transition: fill 0.3s ease, filter 0.3s ease, transform 0.2s ease;
    }

    /* Aktiva tillstånd för respektive symbol */
    .indicator-icon.active.turn-icon {
      fill: var(--color-turn);
      filter: drop-shadow(0 0 6px var(--color-turn));
    }

    .indicator-icon.active.lowbeam-icon {
      fill: var(--color-lowbeam);
      filter: drop-shadow(0 0 6px var(--color-lowbeam));
    }

    .indicator-icon.active.highbeam-icon {
      fill: var(--color-highbeam);
      filter: drop-shadow(0 0 6px var(--color-highbeam));
    }

    .indicator-icon.active.warning-icon {
      fill: var(--color-warning);
      filter: drop-shadow(0 0 8px var(--color-warning));
      animation: pulse 1s infinite alternate; /* Blinkande effekt för varning */
    }

    .indicator-icon.active.tpms-icon {
      fill: var(--color-tpms);
      filter: drop-shadow(0 0 6px var(--color-tpms));
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* Övre sektionen med de två runda visarna */
    .gauges-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .gauge-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: var(--track-color);
      stroke-width: 8;
    }

    .gauge-progress {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
      stroke-dasharray: 565.48;
      stroke-dashoffset: 565.48;
    }

    .speed-ring {
      stroke: var(--speed-color);
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4));
    }

    .range-ring {
      stroke: var(--range-color);
      filter: drop-shadow(0 0 8px rgba(56, 239, 125, 0.4));
    }

    .gauge-data {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .gauge-value {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1px;
    }

    .gauge-unit {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 6px;
    }

    /* Bottenindikator för batteri */
    .battery-container {
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .battery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .battery-percentage {
      color: var(--text-main);
      font-weight: 700;
    }

    .battery-bar-track {
      width: 100%;
      height: 8px;
      background: var(--track-color);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .battery-bar-fill {
      height: 100%;
      background: var(--battery-color);
      width: 0%;
      border-radius: 4px;
      transition: width 0.5s ease, background-color 0.3s ease;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    /* Kontroller längst ner för demo/testning */
    .controls {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: rgba(255, 255, 255, 0.02);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
      max-width: 800px;
    }

    .sliders-group {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex: 1;
    }

    .checkboxes-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .checkbox-label input {
      cursor: pointer;
      accent-color: var(--speed-color);
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <!-- Övre rad med indikatorsymboler -->
    <div class="indicators-bar">
      <!-- Vänster Blinkers -->
      <svg id="icon-turn-left" class="indicator-icon turn-icon" viewBox="0 0 24 24">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>

      <!-- Halvljus -->
      <svg id="icon-low-beam" class="indicator-icon lowbeam-icon" viewBox="0 0 24 24">
        <path d="M12 4C7.58 4 4 7.58 4 12s3.58 8 8 8V4zm9.17 3.05l-3.54 2.04 1 1.73 3.54-2.04-1-1.73zM18.5 12h4v-2h-4v2zm1.17 4.91l-3.54-2.04-1 1.73 3.54 2.04 1-1.73z"/>
      </svg>

      <!-- Helljus -->
      <svg id="icon-high-beam" class="indicator-icon highbeam-icon" viewBox="0 0 24 24">
        <path d="M12 4C7.58 4 4 7.58 4 12s3.58 8 8 8V4zm6 2h5v2h-5V6zm0 5h5v2h-5v-2zm0 5h5v2h-5v-2z"/>
      </svg>

      <!-- Däcktrycksvarning (TPMS) -->
      <svg id="icon-tpms" class="indicator-icon tpms-icon" viewBox="0 0 24 24">
        <path d="M12 2c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18c-.46.59-.28 1.44.38 1.8 1.97 1.07 4.41 1.7 7.27 1.7s5.3-.63 7.27-1.7c.66-.36.84-1.21.38-1.8l-.62-1.39C20.26 15.07 21 13.12 21 11c0-4.97-4.03-9-9-9zm-1 5h2v6h-2V7zm1 10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
      </svg>

      <!-- Allmän Varning / Hazard -->
      <svg id="icon-warning" class="indicator-icon warning-icon" viewBox="0 0 24 24">
        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
      </svg>

      <!-- Höger Blinkers -->
      <svg id="icon-turn-right" class="indicator-icon turn-icon" viewBox="0 0 24 24">
        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/>
      </svg>
    </div>

    <!-- Övre visare -->
    <div class="gauges-container">
      
      <!-- Vänster: Hastighet -->
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 200 200">
          <circle class="gauge-bg" cx="100" cy="100" r="90" />
          <circle class="gauge-progress speed-ring" id="speed-circle" cx="100" cy="100" r="90" />
        </svg>
        <div class="gauge-data">
          <span class="gauge-value" id="speed-text">85</span>
          <span class="gauge-unit">km/h</span>
        </div>
      </div>

      <!-- Höger: Räckvidd -->
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 200 200">
          <circle class="gauge-bg" cx="100" cy="100" r="90" />
          <circle class="gauge-progress range-ring" id="range-circle" cx="100" cy="100" r="90" />
        </svg>
        <div class="gauge-data">
          <span class="gauge-value" id="range-text">320</span>
          <span class="gauge-unit">km kvar</span>
        </div>
      </div>

    </div>

    <!-- Botten: Batteriindikator -->
    <div class="battery-container">
      <div class="battery-header">
        <span>Batteri</span>
        <span class="battery-percentage" id="battery-text">78%</span>
      </div>
      <div class="battery-bar-track">
        <div class="battery-bar-fill" id="battery-bar"></div>
      </div>
    </div>
  </div>

  <!-- Interaktiva reglage och kryssrutor -->
  <div class="controls">
    
    <!-- Mätare -->
    <div class="sliders-group">
      <div class="control-group">
        <label for="input-speed">Hastighet (km/h)</label>
        <input type="range" id="input-speed" min="0" max="220" value="85">
      </div>
      <div class="control-group">
        <label for="input-range">Räckvidd (km)</label>
        <input type="range" id="input-range" min="0" max="500" value="320">
      </div>
      <div class="control-group">
        <label for="input-battery">Batteri (%)</label>
        <input type="range" id="input-battery" min="0" max="100" value="78">
      </div>
    </div>

    <!-- Kryssrutor för Symboler -->
    <div class="checkboxes-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chk-turn-left"> Vänster blinkers
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-low-beam" checked> Halvljus
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-high-beam"> Helljus
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-tpms"> Däcktryck (TPMS)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-warning"> Varning / Hazard
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chk-turn-right"> Höger blinkers
      </label>
    </div>

  </div>

  <script>
    const CIRCUMFERENCE = 2 * Math.PI * 90; // ~565.48

    // Elements - Gauges
    const speedCircle = document.getElementById('speed-circle');
    const speedText = document.getElementById('speed-text');
    const inputSpeed = document.getElementById('input-speed');

    const rangeCircle = document.getElementById('range-circle');
    const rangeText = document.getElementById('range-text');
    const inputRange = document.getElementById('input-range');

    const batteryBar = document.getElementById('battery-bar');
    const batteryText = document.getElementById('battery-text');
    const inputBattery = document.getElementById('input-battery');

    // Functions - Gauges
    function updateSpeed(val) {
      const maxSpeed = 220;
      const percentage = Math.min(val / maxSpeed, 1);
      const offset = CIRCUMFERENCE - (percentage * CIRCUMFERENCE);
      speedCircle.style.strokeDashoffset = offset;
      speedText.textContent = val;
    }

    function updateRange(val) {
      const maxRange = 500;
      const percentage = Math.min(val / maxRange, 1);
      const offset = CIRCUMFERENCE - (percentage * CIRCUMFERENCE);
      rangeCircle.style.strokeDashoffset = offset;
      rangeText.textContent = val;
    }

    function updateBattery(val) {
      batteryBar.style.width = val + '%';
      batteryText.textContent = val + '%';

      if (val <= 15) {
        batteryBar.style.backgroundColor = '#ef4444';
      } else if (val <= 30) {
        batteryBar.style.backgroundColor = '#f59e0b';
      } else {
        batteryBar.style.backgroundColor = '#10b981';
      }
    }

    // Sliders Event Listeners
    inputSpeed.addEventListener('input', (e) => updateSpeed(e.target.value));
    inputRange.addEventListener('input', (e) => updateRange(e.target.value));
    inputBattery.addEventListener('input', (e) => updateBattery(e.target.value));

    // Setup Checkbox Toggles for Symbols
    function setupToggle(checkboxId, iconId) {
      const checkbox = document.getElementById(checkboxId);
      const icon = document.getElementById(iconId);

      const updateState = () => {
        if (checkbox.checked) {
          icon.classList.add('active');
        } else {
          icon.classList.remove('active');
        }
      };

      checkbox.addEventListener('change', updateState);
      updateState(); // Initialisera vid start
    }

    // Koppla ihop kryssrutorna med ikonerna
    setupToggle('chk-turn-left', 'icon-turn-left');
    setupToggle('chk-low-beam', 'icon-low-beam');
    setupToggle('chk-high-beam', 'icon-high-beam');
    setupToggle('chk-tpms', 'icon-tpms');
    setupToggle('chk-warning', 'icon-warning');
    setupToggle('chk-turn-right', 'icon-turn-right');

    // Initialisera värden
    updateSpeed(inputSpeed.value);
    updateRange(inputRange.value);
    updateBattery(inputBattery.value);
  </script>

</body>
</html>
